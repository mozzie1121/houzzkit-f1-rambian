# Cloud build for Houzzkit F1 (RK3568-JL-RM01)
#
# Strategy: keep this repo as a lightweight device overlay.
# 1. checkout the upstream build system (amlogic-s9xxx-armbian)
# 2. apply overlay/different-files + model_database row
# 3. run the upstream composite action with -b houzzkit-f1
#
name: Build Armbian for Houzzkit F1

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      set_release:
        description: "Select OS Release."
        required: false
        default: "noble"
        type: choice
        options:
          - noble
          - trixie
          - resolute
      armbian_url:
        description: "Base Armbian image URL (rock-3a archive). Empty = auto resolve."
        required: false
        default: ""
      kernel_usage:
        description: "Kernel tag suffix (rk35xx / stable)."
        required: false
        default: "rk35xx"
      armbian_kernel:
        description: "Kernel version (e.g. 6.1.y, 6.6.y, 6.12.y)."
        required: false
        default: "6.1.y"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream build system
        uses: actions/checkout@v4
        with:
          repository: mozzie1121/amlogic-s9xxx-armbian
          path: upstream

      - name: Checkout houzzkit-f1 device overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)

      - name: Resolve base Armbian image URL (rock-3a)
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.armbian_url }}" ]]; then
            echo "ARMBIAN_URL=${{ github.event.inputs.armbian_url }}" >> "${GITHUB_ENV}"
          else
            release="${{ github.event.inputs.set_release }}"
            base="https://dl.armbian.com/rock-3a/archive/"
            listing="$(curl -fsSL "${base}")"
            # Prefer the vendor (BSP 6.1) minimal image, fall back to current.
            file="$(echo "${listing}" | grep -oE "Armbian_[^\"]*_${release}_vendor_[^\"]*_minimal\\.img\\.xz" | head -n 1)"
            [[ -z "${file}" ]] && file="$(echo "${listing}" | grep -oE "Armbian_[^\"]*_${release}_current_[^\"]*_minimal\\.img\\.xz" | head -n 1)"
            if [[ -z "${file}" ]]; then
              echo "Error: no Armbian ${release} base image for rock-3a."
              exit 1
            fi
            echo "ARMBIAN_URL=${base}${file}" >> "${GITHUB_ENV}"
          fi
          echo "Resolved base image for release ${release:-custom}."

      - name: Apply houzzkit-f1 device overlay
        run: |
          bash "${GITHUB_WORKSPACE}/overlay/scripts/apply-overlay.sh" \
            "${GITHUB_WORKSPACE}/upstream" \
            "${GITHUB_WORKSPACE}/overlay"

      - name: Rebuild Armbian for houzzkit-f1
        uses: ./upstream
        with:
          armbian_path: ${{ env.ARMBIAN_URL }}
          armbian_board: houzzkit-f1
          kernel_repo: ophub/kernel
          kernel_usage: ${{ github.event.inputs.kernel_usage }}
          armbian_kernel: ${{ github.event.inputs.armbian_kernel }}
          auto_kernel: "true"
          armbian_fstype: ext4

      - name: Upload image to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            upstream/build/output/images/*.img.gz
            upstream/build/output/images/*.img.xz
          tag_name: houzzkit-f1-${{ github.event.inputs.set_release }}
          draft: true
