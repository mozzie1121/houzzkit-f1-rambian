# Cloud build for Houzzkit F1 (RK3568-JL-RM01)
#
# Strategy: keep this repo as a lightweight device overlay.
# 1. checkout the upstream build system (amlogic-s9xxx-armbian)
# 2. apply overlay/different-files + model_database row
# 3. run the upstream composite action with -b houzzkit-f1
#
name: Build Armbian for Houzzkit F1

on:
  workflow_dispatch:
    inputs:
      set_release:
        description: "Select OS Release."
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - trixie
          - noble
          - resolute
      kernel_usage:
        description: "Kernel tag suffix (rk35xx / stable)."
        required: false
        default: "rk35xx"
      armbian_kernel:
        description: "Kernel version (e.g. 6.1.y, 6.6.y, 6.12.y)."
        required: false
        default: "6.1.y"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout upstream build system
        uses: actions/checkout@v4
        with:
          repository: mozzie1121/amlogic-s9xxx-armbian
          path: upstream

      - name: Checkout houzzkit-f1 device overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2204-build-armbian-depends)

      - name: Download base Armbian image from upstream releases
        run: |
          set -euo pipefail
          build_path="${GITHUB_WORKSPACE}/upstream/build/output/images"
          mkdir -p "${build_path}"
          release="${{ github.event.inputs.set_release }}"
          asset_name=$(curl -fsSL \
            "https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases?per_page=20" | \
            jq -r '[.[].assets[].name] | map(select(test("^Armbian_'"${release}"'_arm64_.*\\.img\\.gz$"))) | .[0]')
          if [[ -z "${asset_name}" || "${asset_name}" == "null" ]]; then
            echo "Error: no Armbian ${release} base image found in ophub releases."
            exit 1
          fi
          echo "Downloading: ${asset_name}"
          curl -fsSL -o "${build_path}/${asset_name}" \
            "https://github.com/ophub/amlogic-s9xxx-armbian/releases/latest/download/${asset_name}"

      - name: Apply houzzkit-f1 device overlay
        run: |
          bash "${GITHUB_WORKSPACE}/overlay/scripts/apply-overlay.sh" \
            "${GITHUB_WORKSPACE}/upstream" \
            "${GITHUB_WORKSPACE}/overlay"

      - name: Rebuild Armbian for houzzkit-f1
        uses: ./upstream
        with:
          armbian_board: houzzkit-f1
          kernel_repo: ophub/kernel
          kernel_usage: ${{ github.event.inputs.kernel_usage }}
          armbian_kernel: ${{ github.event.inputs.armbian_kernel }}
          auto_kernel: "true"
          armbian_fstype: ext4

      - name: Upload image to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            upstream/build/output/images/*.img.gz
            upstream/build/output/images/*.img.xz
          tag_name: houzzkit-f1-${{ github.event.inputs.set_release }}
          draft: true
